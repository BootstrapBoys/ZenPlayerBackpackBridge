name: Build and Release

on:
  push:
    tags:
      - 'v*' # Still triggers automatically on version tags
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag/name for the release (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0-manual'

jobs:
  build-and-release:
    name: Build DLL and Create Release
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Project
        run: dotnet build --configuration Release --output ./build_output

      - name: Prepare Package Files
        shell: pwsh
        run: |
          $stagingDir = "./package_staging"
          New-Item -ItemType Directory -Force -Path $stagingDir

          Copy-Item "./build_output/*.dll" -Destination $stagingDir

          $filesToCopy = @("CHANGELOG.md", "manifest.json", "icon.png", "README.md")
          foreach ($file in $filesToCopy) {
              if (Test-Path $file) {
                  Copy-Item $file -Destination $stagingDir
                  Write-Host "Copied $file to staging."
              } else {
                  Write-Warning "Required file $file was not found in repository root!"
              }
          }

      - name: Determine Version
        shell: pwsh
        run: |
          # If triggered manually, use the input version. If triggered by a tag, use the git ref.
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
              $version = "${{ inputs.version }}"
          } else {
              $version = $env:GITHUB_REF_NAME
          }
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Create Zip Archive
        shell: pwsh
        run: |
          $zipName = "ZenPlayerBackpackBridge-$env:VERSION.zip"
          Compress-Archive -Path "./package_staging/*" -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "Release ${{ env.VERSION }}"
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
